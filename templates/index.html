<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpO2 Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style-index.css') }}">
</head>
<body>

    <header>
        <h1>SpO2 and BioZ Dashboard</h1>
        <span class="subtitle">sleep monitoring · overnight session</span>
        <span class="subtitle" id="logout">logout -></span>
    </header>

    <nav class="patient-tabs">
        <button class="patient-button active" data-patient="1">Patient 1</button>
        <button class="patient-button" data-patient="2">Patient 2</button>
        <button class="patient-button" data-patient="3">Patient 3</button>
    </nav>

    <div class="stats">
        <div class="stat">
            <div class="stat-label">Average SpO2</div>
            <div class="stat-value" id="stat-avg">—<span class="unit">%</span></div>
        </div>
        <div class="stat">
            <div class="stat-label">Minimum</div>
            <div class="stat-value" id="stat-min">—<span class="unit">%</span></div>
        </div>
        <div class="stat">
            <div class="stat-label">Maximum</div>
            <div class="stat-value" id="stat-max">—<span class="unit">%</span></div>
        </div>
        <div class="stat">
            <div class="stat-label">Readings</div>
            <div class="stat-value" id="stat-count">—</div>
        </div>
    </div>

    <div class="filter">
        <label for="start-time">Start:</label>
        <input type="time" name="start-time" id="start-time" step="1">
        <label for="end-time">End:</label>
        <input type="time" name="end-time" id="end-time" step="1">
        <button type="button" id="filter-button">Filter</button>
        <button type="button" id="filter-reset">Reset</button>
    </div>

    <div class="chart-card">
        <div class="chart-header">
            <span class="chart-title">Blood Oxygen Saturation over Time</span>
            <span class="badge">Valid readings only</span>
        </div>
        <canvas id="spo2Chart"></canvas>
    </div>

    <div class="stats">
        <div class="stat">
            <div class="stat-label">Average BioZ</div>
            <div class="stat-value" id="stat-avg-bioz">—<span class="unit"></span></div>
        </div>
        <div class="stat">
            <div class="stat-label">Minimum</div>
            <div class="stat-value" id="stat-min-bioz">—<span class="unit"></span></div>
        </div>
        <div class="stat">
            <div class="stat-label">Maximum</div>
            <div class="stat-value" id="stat-max-bioz">—<span class="unit"></span></div>
        </div>
        <div class="stat">
            <div class="stat-label">Readings</div>
            <div class="stat-value" id="stat-count-bioz">—</div>
        </div>
    </div>

    <div class="filter">
        <label for="start-time-bioz">Start:</label>
        <input type="number" name="start-time-bioz" id="start-time-bioz" step="0.001">
        <label for="end-time-bioz">End:</label>
        <input type="number" name="end-time-bioz" id="end-time-bioz" step="0.001">
        <button type="button" id="filter-button-bioz">Filter</button>
        <button type="button" id="filter-reset-bioz">Reset</button>
    </div>

    <div class="chart-card">
        <div class="chart-header">
            <span class="chart-title">BioZ over Time in Seconds</span>
        </div>
        <canvas id="biozChart"></canvas>
    </div>

    <script src="{{ url_for('static', filename='js/spo2chart.js') }}"></script>

</body>
</html>
